spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tpi_db?serverTimezone=UTC
    username: postgres
    password: pgadmin123
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
    show-sql: true

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
      springframework:
        web: INFO
