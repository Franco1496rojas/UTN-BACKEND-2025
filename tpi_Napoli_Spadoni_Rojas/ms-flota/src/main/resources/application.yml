server:
  port: 8082

spring:
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://postgres:5432/tpi_db
    username: postgres
    password: pgadmin123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

# --- Logs ---
logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
      springframework:
        web: INFO

# --- Swagger (Springdoc) ---
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
